name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova Project & Build APK
      run: |
        cordova create sushiApp com.sushicraft.app "SushiCraft"
        cd sushiApp
        cordova platform add android
        rm -rf www/*
        cp -r ../index.html www/
        cordova build android --no-telemetry

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SushiCraft-Android-APK
        path: sushiApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
