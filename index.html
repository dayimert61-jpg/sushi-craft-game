<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sushi Craft Pro - Restaurant Experience</title>
    <script src="cordova.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --counter-wood: #2b1d0c;
            --card-bg: #1e1e1e;
            --accent-gold: #ffb703;
            --primary-red: #d62828;
            --success-green: #2a9d8f;
            --text-light: #f1faee;
            --chip-bg: #333333;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #0a0a0a 0%, #1a0f07 100%);
            color: var(--text-light);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            min-height: 100vh;
        }

        .restaurant-header {
            width: 100%;
            max-width: 480px;
            text-align: center;
            margin-bottom: 8px;
        }

        .restaurant-title {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--accent-gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .header-stats {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border: 1px solid #444;
            border-radius: 14px;
            padding: 10px 14px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.6);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .stat-box { text-align: center; }
        .stat-label { font-size: 0.65rem; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 1.2rem; font-weight: 800; color: var(--accent-gold); }

        /* Character & Ambience Section */
        .character-zone {
            width: 100%;
            max-width: 480px;
            background: radial-gradient(circle, #3d2b1f 0%, #1f140d 100%);
            border: 2px solid var(--accent-gold);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
            position: relative;
        }

        .customer-avatar {
            font-size: 3rem;
            background: rgba(255,255,255,0.1);
            padding: 8px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .speech-bubble {
            flex: 1;
            background: #ffffff;
            color: #222;
            padding: 10px 14px;
            border-radius: 12px;
            position: relative;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .speech-bubble::before {
            content: '';
            position: absolute;
            left: -10px;
            top: 50%;
            transform: translateY(-50%);
            border-width: 6px 10px 6px 0;
            border-style: solid;
            border-color: transparent #ffffff transparent transparent;
        }

        .customer-name {
            font-size: 0.75rem;
            color: #d62828;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .sushi-order-name {
            font-size: 1rem;
            color: #111;
        }

        /* Cooking Table & Ingredients */
        .game-card {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid #444;
            border-radius: 16px;
            padding: 14px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }

        .plate-area {
            min-height: 75px;
            border: 2px dashed #666;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px;
            margin-bottom: 12px;
            background-color: #181818;
            flex-wrap: wrap;
        }

        .ingredient-chip {
            background-color: var(--chip-bg);
            border: 1px solid #555;
            color: var(--text-light);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .grid-ingredients {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .btn-ingredient {
            background: linear-gradient(145deg, #333333, #222222);
            color: #fff;
            border: 1px solid #555;
            padding: 12px 4px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }

        .btn-ingredient:active { transform: scale(0.94); }

        .action-buttons { display: flex; gap: 10px; }
        .btn-action {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            color: white;
            text-transform: uppercase;
        }

        .btn-serve { background-color: var(--success-green); }
        .btn-clear { background-color: var(--primary-red); }

        .message-box {
            text-align: center;
            font-weight: 800;
            height: 22px;
            margin-top: 8px;
            font-size: 0.95rem;
        }

        .success { color: #4adb8a; }
        .error { color: #ff6b6b; }
    </style>
</head>
<body>

    <div class="restaurant-header">
        <div class="restaurant-title">🏮 TOKYO SUSHI BAR 🏮</div>
    </div>

    <div class="header-stats">
        <div class="stat-box">
            <div class="stat-label">Score</div>
            <div class="stat-value" id="score">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Combo</div>
            <div class="stat-value" id="combo" style="color: #4adb8a;">x1</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Customer</div>
            <div class="stat-value" id="customer">#1</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Time</div>
            <div class="stat-value" id="timer" style="color: var(--primary-red);">60s</div>
        </div>
    </div>

    <!-- Character Ambience & Order Bubble -->
    <div class="character-zone">
        <div class="customer-avatar" id="customer-avatar">👨‍💼</div>
        <div class="speech-bubble">
            <div class="customer-name" id="customer-type">Business Man</div>
            <div class="sushi-order-name">I want <strong id="target-sushi-name" style="color:#d62828;">Loading...</strong></div>
            <div id="target-ingredients" style="margin-top: 6px; display:flex; gap:4px; flex-wrap:wrap;"></div>
        </div>
    </div>

    <div class="game-card">
        <div style="font-size: 0.8rem; color: #aaa; margin-bottom: 6px; font-weight:700;">PREPARATION BOARD:</div>
        <div class="plate-area" id="plate">
            <span style="color: #777; font-size: 0.85rem;">Select ingredients to assemble sushi...</span>
        </div>

        <div style="font-size: 0.8rem; color: #aaa; margin-bottom: 6px; font-weight:700;">INGREDIENTS:</div>
        <div class="grid-ingredients">
            <button class="btn-ingredient" onclick="addIngredient('Rice')">🍚 Rice</button>
            <button class="btn-ingredient" onclick="addIngredient('Nori')">⬛ Nori</button>
            <button class="btn-ingredient" onclick="addIngredient('Salmon')">🍣 Salmon</button>
            <button class="btn-ingredient" onclick="addIngredient('Tuna')">🐟 Tuna</button>
            <button class="btn-ingredient" onclick="addIngredient('Avocado')">🥑 Avocado</button>
            <button class="btn-ingredient" onclick="addIngredient('Cucumber')">🥒 Cucumber</button>
            <button class="btn-ingredient" onclick="addIngredient('Soy Sauce')">🥢 Soy Sauce</button>
            <button class="btn-ingredient" onclick="addIngredient('Wasabi')">🟢 Wasabi</button>
            <button class="btn-ingredient" onclick="addIngredient('Green Tea')">🍵 Green Tea</button>
        </div>

        <div class="action-buttons">
            <button class="btn-action btn-clear" onclick="clearPlate()">Clear Board</button>
            <button class="btn-action btn-serve" onclick="serveOrder()">Serve Customer</button>
        </div>

        <div class="message-box" id="message"></div>
    </div>

    <script>
        const customers = [
            { type: "Business Man", avatar: "👨‍💼" },
            { type: "Artist", avatar: "👩‍🎨" },
            { type: "Food Critic", avatar: "🧑‍🍳" },
            { type: "Student", avatar: "👨‍🎓" },
            { type: "Ninja", avatar: "🥷" }
        ];

        const recipes = [
            { name: "Salmon Nigiri Set", ingredients: ["Rice", "Salmon", "Soy Sauce"] },
            { name: "Spicy Tuna Roll", ingredients: ["Rice", "Nori", "Tuna", "Wasabi"] },
            { name: "California Special", ingredients: ["Rice", "Nori", "Avocado", "Soy Sauce"] },
            { name: "Veggie Fresh Roll", ingredients: ["Rice", "Nori", "Avocado", "Cucumber"] },
            { name: "Supreme Gourmet", ingredients: ["Rice", "Nori", "Salmon", "Avocado", "Green Tea"] },
            { name: "Tuna Wasabi Delight", ingredients: ["Rice", "Tuna", "Wasabi", "Green Tea"] }
        ];

        let currentRecipe = {};
        let currentCustomer = {};
        let currentPlate = [];
        let score = 0;
        let combo = 1;
        let customerCount = 1;
        let timeLeft = 60;
        let timerInterval;

        function startGame() {
            score = 0;
            combo = 1;
            customerCount = 1;
            timeLeft = 60;
            document.getElementById('score').innerText = score;
            document.getElementById('combo').innerText = "x" + combo;
            document.getElementById('customer').innerText = "#" + customerCount;
            nextOrder();
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft + "s";
                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("⏰ Time's Up Chef!\nFinal Score: " + score + " Pts\nTotal Customers Served: " + (customerCount - 1));
                    startGame();
                }
            }, 1000);
        }

        function nextOrder() {
            // Pick Random Customer & Recipe
            currentCustomer = customers[Math.floor(Math.random() * customers.length)];
            currentRecipe = recipes[Math.floor(Math.random() * recipes.length)];

            document.getElementById('customer-avatar').innerText = currentCustomer.avatar;
            document.getElementById('customer-type').innerText = currentCustomer.type;
            document.getElementById('target-sushi-name').innerText = currentRecipe.name;
            
            const targetDiv = document.getElementById('target-ingredients');
            targetDiv.innerHTML = '';
            currentRecipe.ingredients.forEach(ing => {
                const chip = document.createElement('span');
                chip.className = 'ingredient-chip';
                chip.innerText = ing;
                targetDiv.appendChild(chip);
            });
            clearPlate();
        }

        function addIngredient(ing) {
            currentPlate.push(ing);
            renderPlate();
        }

        function clearPlate() {
            currentPlate = [];
            renderPlate();
        }

        function renderPlate() {
            const plateDiv = document.getElementById('plate');
            plateDiv.innerHTML = '';
            if(currentPlate.length === 0) {
                plateDiv.innerHTML = '<span style="color: #777; font-size: 0.85rem;">Select ingredients to assemble sushi...</span>';
                return;
            }
            currentPlate.forEach(ing => {
                const chip = document.createElement('span');
                chip.className = 'ingredient-chip';
                chip.innerText = ing;
                plateDiv.appendChild(chip);
            });
        }

        function serveOrder() {
            const msgBox = document.getElementById('message');
            const isCorrect = currentPlate.length === currentRecipe.ingredients.length &&
                              currentPlate.every((val, index) => val === currentRecipe.ingredients[index]);

            if (isCorrect) {
                const pointsEarned = 20 * combo;
                score += pointsEarned;
                combo++;
                msgBox.className = "message-box success";
                msgBox.innerText = "+" + pointsEarned + " Pts! Perfect Meal Served!";
                customerCount++;
                document.getElementById('score').innerText = score;
                document.getElementById('combo').innerText = "x" + combo;
                document.getElementById('customer').innerText = "#" + customerCount;
                setTimeout(() => {
                    msgBox.innerText = "";
                    nextOrder();
                }, 1000);
            } else {
                score = Math.max(0, score - 5);
                combo = 1;
                msgBox.className = "message-box error";
                msgBox.innerText = "-5 Pts! Wrong Recipe!";
                document.getElementById('score').innerText = score;
                document.getElementById('combo').innerText = "x" + combo;
            }
        }

        window.onload = startGame;
    </script>
</body>
</html>
